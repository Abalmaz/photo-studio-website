<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Taran AY Photography specializes in newborn, maternity, and cake smash photography.">
  <title>Taran AY Photography — Newborn, Maternity & Cake Smash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gupter:wght@400&family=Source+Sans+Pro:wght@300&family=Dancing+Script:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <main>
    <section class="hero">
      <h1>Taran AY</h1>
      <p class="lead">newborn & maternity studio</p>
      <p class="tagline">Capturing the Tiniest Moments & Motherhood Journey</p>
      <a href="https://nXXXXXX.alteg.io/" class="btn ms_booking">Online Booking</a>
    </section>

    <section class="section">
      <div class="container">
        <div class="category-showcase">
          <div class="category-card">
            <a href="/gallery">
              <img src="/images/newborn.png" alt="A sleeping newborn baby" class="category-card__image">
            </a>
            <h3 class="category-card__title">Newborn</h3>
          </div>
          <div class="category-card">
            <a href="/gallery">
              <img src="/images/cakesmash.png" alt="A baby enjoying a cake smash" class="category-card__image">
            </a>
            <h3 class="category-card__title">Cake Smash</h3>
          </div>
          <div class="category-card">
            <a href="/gallery">
              <img src="/images/maternity.png" alt="An expectant mother during a maternity photoshoot" class="category-card__image">
            </a>
            <h3 class="category-card__title">Maternity</h3>
          </div>
        </div>
      </div>
    </section>

    <section class="cta-banner">
      <div class="container">
        <h2>Follow Our Journey</h2>
        <p>See our latest work and behind-the-scenes moments on Instagram.</p>
        <a href="https://www.instagram.com/taran_ay_photography/" class="btn" target="_blank" rel="noopener noreferrer">Follow on Instagram</a>
      </div>
    </section>
  </main>

  <script type="text/javascript" src="https://wXXXXXX.alteg.io/widget/object/js" charset="UTF-8"></script>
  <script src="/js/main.js"></script>
</body>
</html>
