<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio gallery for Taran AY Photography, showcasing maternity, newborn, and cake smash photos.">
  <title>Gallery — Taran AY Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gupter:wght@400&family=Source+Sans+Pro:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <a href="/" class="logo">
        <img src="/images/logo.png" alt="Taran AY Photography Logo">
      </a>
      <nav class="nav" aria-label="Main navigation">
        <ul class="nav__list">
          <li><a href="/" class="nav__link">Home</a></li>
          <li><a href="/services" class="nav__link">Services</a></li>
          <li><a href="/gallery" class="nav__link nav__link--active">Gallery</a></li>
          <li><a href="/contact" class="nav__link">Contact</a></li>
          <li><a href="https://n1458700.alteg.io/" class="btn ms_booking">Book Now</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <ul class="mobile-nav__list">
      <li><a href="/" class="mobile-nav__link">Home</a></li>
      <li><a href="/services" class="mobile-nav__link">Services</a></li>
      <li><a href="/gallery" class="mobile-nav__link">Gallery</a></li>
      <li><a href="/contact" class="mobile-nav__link">Contact</a></li>
      <li><a href="https://n1458700.alteg.io/" class="btn ms_booking" style="margin-top: 1rem;">Book Now</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <section class="page-hero">
      <div class="container">
        <h1 class="eyebrow">Portfolio</h1>
        <p class="lead">A curated collection of our favorite moments.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery-grid">
          <div class="gallery-item"><img src="/images/maternity-01.jpg" alt="Maternity photo"></div>
          <div class="gallery-item"><img src="/images/newborn-01.jpg" alt="Newborn photo"></div>
          <div class="gallery-item"><img src="/images/cakesmash-01.jpg" alt="Cake smash photo"></div>
          <div class="gallery-item"><img src="/images/maternity-02.jpg" alt="Maternity photo"></div>
          <div class="gallery-item"><img src="/images/newborn-02.jpg" alt="Newborn photo"></div>
          <div class="gallery-item"><img src="/images/cakesmash-02.jpg" alt="Cake smash photo"></div>
          <div class="gallery-item"><img src="/images/maternity-03.jpg" alt="Maternity photo"></div>
          <div class="gallery-item"><img src="/images/newborn-03.jpg" alt="Newborn photo"></div>
          <div class="gallery-item"><img src="/images/cakesmash-03.jpg" alt="Cake smash photo"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>&copy; <span id="year"></span> Taran AY Photography</p>
      <div class="footer-social">
        <a href="https://www.instagram.com/taran_ay_photography/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </div>
  </footer>
  <script type="text/javascript" src="https://w1458700.alteg.io/widgetJS" charset="UTF-8"></script>
  <script src="/js/main.js"></script>
</body>
</html>
